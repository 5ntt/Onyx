services:
  - type: web
    name: onyx-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MAX_FILE_MB
        value: "49"
      - key: COOLDOWN_SECONDS
        value: "4"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: REQUIRED_CHANNEL
        value: ""
      - key: SUPPORT_URL
        value: ""
